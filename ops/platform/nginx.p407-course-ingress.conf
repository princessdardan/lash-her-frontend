worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events { worker_connections 128; }

http {
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;

    server {
        listen 8443 ssl;
        server_name api-p407.lashher.com;
        ssl_certificate /candidate-cert.pem;
        ssl_certificate_key /candidate-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_header_timeout 5s;
        client_body_timeout 5s;
        keepalive_timeout 5s;
        access_log off;
        error_log /dev/null crit;
        if ($host != api-p407.lashher.com) { return 404; }

        location = /internal/p4-07/postgres {
            if ($request_uri != /internal/p4-07/postgres) { return 404; }
            proxy_pass http://relay:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_connect_timeout 3s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
        }

        # The guard verifies exact original paths, queries, methods and scope.
        location ~ "^/course/v1/(internal/(checkout-offer|entitlements/(grants|revocations))|courses/[a-z0-9-]+|student/(courses/[a-f0-9-]+|lessons/[a-f0-9-]+|progress))$" {
            client_max_body_size 4096;
            proxy_pass http://course-checkout-guard:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection close;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location / { return 404; }
    }
}
