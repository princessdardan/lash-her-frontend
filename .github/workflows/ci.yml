          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when count(*) = 2 and count(*) filter (where evidence->>'provider_transaction_id' = 'ci-helcim-duplicate') = 2 then 'quarantine-evidence-preserves-provider-identity' else (1/0)::text end from fulfillment_data_quarantine where reason_code = 'duplicate_helcim_transaction_id'"
          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when count(*) filter (where evidence ?| array['customer_name', 'customer_email', 'shipping_address', 'checkout_token_hash', 'secret_token_ciphertext', 'refund_origin_ip_ciphertext', 'cause', 'evidence_checklist', 'reason', 'last_error_code', 'disclosure_snapshot', 'line_items']) = 0 then 'quarantine-evidence-is-non-pii' else (1/0)::text end from fulfillment_data_quarantine"
          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when count(*) = 2 then 'duplicate-identities-isolated' else (1/0)::text end from checkout_orders where order_id like 'ci-upgrade-0033-duplicate-%' and fulfillment_quarantined_at is not null and fulfillment_quarantine_reason = 'duplicate_helcim_transaction_id' and payment_risk_status = 'review_required'"
