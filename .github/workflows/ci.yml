          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when count(*) = 2 and count(distinct provider_refund_id) = 1 then 'provider-refund-history-preserved' else (1/0)::text end from product_order_refunds where idempotency_key in ('cf000000-0000-0000-0000-000000000001', 'cf000000-0000-0000-0000-000000000002') and fulfillment_quarantine_reason = 'duplicate_provider_refund_id'"
          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when status = 'draft' and effective_at is null and superseded_at is null then 'legacy-manual-policy-demoted' else (1/0)::text end from manual_fulfillment_policy_versions where version = 'ci-legacy-unverifiable-v1'"
          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when count(*) = 1 and bool_and(evidence->>'policy_text_hash_valid' = 'false') and bool_and(not (evidence ?| array['customer_name', 'customer_email', 'shipping_address', 'checkout_token_hash', 'secret_token_ciphertext'])) then 'legacy-manual-policy-quarantined' else (1/0)::text end from fulfillment_data_quarantine where entity_type = 'manual_fulfillment_policy_version' and entity_id = 'ab000000-0000-0000-0000-000000000050' and reason_code = 'effective_policy_evidence_unverifiable'"
          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when revoked_at is not null and contract_snapshot is null then 'legacy-helcim-certification-revoked' else (1/0)::text end from fulfillment_provider_certifications where id = 'ac000000-0000-0000-0000-000000000054'"
          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when count(*) = 1 and bool_and(evidence->>'provider' = 'helcim') and bool_and(evidence->>'scope' = 'product_payments') and bool_and(not (evidence ?| array['certified_by_owner_name', 'evidence_reference', 'customer_name', 'customer_email'])) then 'legacy-helcim-certification-quarantined' else (1/0)::text end from fulfillment_data_quarantine where entity_type = 'fulfillment_provider_certification' and entity_id = 'ac000000-0000-0000-0000-000000000054' and reason_code = 'helcim_contract_snapshot_unverifiable'"
