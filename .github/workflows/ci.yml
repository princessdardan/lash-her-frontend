          psql --host=127.0.0.1 --username=postgres --dbname=lash_her_ci_upgrade --set=ON_ERROR_STOP=1 --tuples-only --command="select case when count(*) = 5 and count(*) filter (where status = 'paid') = 4 and count(*) filter (where status = 'pending') = 1 then 'upgrade-data-ok' else (1/0)::text end from checkout_orders where order_id like 'ci-upgrade-0033-%'"
